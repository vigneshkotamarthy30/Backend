server.port=8080
spring.application.name=hotel-management-system

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotel_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.security.user.name=

jwt.secret=${JWT_SECRET:myVerySecureHotelSecretKey1234567890}
jwt.expiration-ms=86400000

app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.timezone=UTC
app.currency=INR

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
